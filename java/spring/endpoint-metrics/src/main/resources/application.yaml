spring:
    application:
        name: endpoint-metrics
    datasource:
        url: jdbc:h2:mem:metrics
        driverClassName: org.h2.Driver
        username: sa
        password:
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        show-sql: true
    sql:
        init:
            mode: embedded
    h2:
        console:
            enabled: true
