<!DOCTYPE html>
<html>
  <head>
    <title>Simple Chat Bot</title>
    <style>
      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button {
        background-color: rgb(25,135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .app-container {
        display: flex;
        flex-direction: column;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
      }
      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;

      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
      .welcome-message {
        margin-top: 10px;
        color: gray;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages, setChatMessages}) {
        const [inputText, setInputText] = React.useState("");

        function saveInpuText(event) {
          const input = event.target;
          setInputText(input.value)
        }

        function sendMessage() {
          const newChatMessages = [
            ...chatMessages,
            {
              id: crypto.randomUUID(),
              message: inputText,
              sender: "user"
            }
          ];
          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              id: crypto.randomUUID(),
              message: response,
              sender: "robot"
            }
          ]);
          setInputText("")
        }

        return (
          <div className="chat-input-container">
            <input
              className="chat-input"
              placeholder="Send a message to ChatBot"
              size="30"
              onChange={saveInpuText}
              value={inputText}
            />
            <button
              className="send-button"
              onClick={sendMessage}
              >Send</button>
          </div>
        );
      }

      function ChatMessage({message, sender}) {

        return (
          <div className={
              sender === "user"
              ? "chat-message-user"
              : "chat-message-robot"}>
            {sender === "robot" && (
              <img src="robot.png" className="chat-message-profile"/>
            )}
            <div className="chat-message-text">
              {message}
            </div>
            {sender === "user" && (
              <img src="user.png" className="chat-message-profile"/>
            )}
          </div>
        )
      }

      function ChatMessages({chatMessages}) {
        // Creates a container with special React features
        const chatMessagesRef = React.useRef(null);
        // Run some code after the component is created or updated.
        React.useEffect(() => {
          const containerElement = chatMessagesRef.current;
          if(containerElement) {
            containerElement.scrollTop = containerElement.scrollHeight;
          }
        }, [chatMessages]);
        //       ^
        // The array controls when useEffect runs(Dependency array), if empty, 
        // only runs once, whent the component is created,
        // or runs the code everytime the passed variables changes
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
                return (
                  <ChatMessage
                    key={chatMessage.id}
                    message={chatMessage.message}
                    sender={chatMessage.sender}/>
                );
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);
        return (
          <div className="app-container">
            {chatMessages.length === 0 && (
              <div className="welcome-message">
                Welcome to the chatbot project! Send a message using the textbox below.
              </div>)}
            <ChatMessages
              chatMessages={chatMessages}/>
              <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}/>     
          </div>
        );
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(
        <App/>
      );
    </script>
  </body>
</html>
